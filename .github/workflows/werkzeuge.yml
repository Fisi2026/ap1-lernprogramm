name: Werkzeuge-Release

# 26.11.2026 (BUILD_LOG 292): Werkzeuge-Release (Plugin fisi, Training Shell, Projekt-Dokument) wird HIER gebaut,
# mit Herkunft bescheinigt und samt Sigstore-Buendel (<tag>.sigstore.json) angehaengt – Scorecard „Signed-Releases“.
# Start: `bash tools/werkzeug_release.sh` (PC) oder Handstart. Fehlt das Release: neu anlegen. Gibt es es ohne
# Signatur (Fingerabdruck gleich): Dateien aus diesem Bau ersetzen und das Buendel anhaengen. Fingerabdruck anders: rot.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: werkzeuge-release
  cancel-in-progress: false

jobs:
  release:
    name: bauen, bescheinigen, anhaengen
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Release anlegen bzw. Anhaenge ersetzen
      id-token: write        # Sigstore-Signatur per OIDC
      attestations: write    # Bescheinigung im Repo ablegen
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bauen
        id: bau
        run: bash tools/werkzeug_release.sh --bauen
      - name: Zustand des Releases
        id: zustand
        env:
          TAG: ${{ steps.bau.outputs.tag }}
          FP: ${{ steps.bau.outputs.fp }}
        run: |
          if ! gh release view "$TAG" --json body >/dev/null 2>&1; then echo "aktion=neu" >> "$GITHUB_OUTPUT"; exit 0; fi
          FP_REL=$(gh release view "$TAG" --json body -q .body | sed -n 's/^FINGERABDRUCK: //p')
          [ "$FP_REL" = "$FP" ] || { echo "::error::Fingerabdruck weicht ab ($FP_REL / $FP) - Version erhoehen"; exit 1; }
          SIG=$(gh release view "$TAG" --json assets -q '[.assets[].name|select(endswith(".sigstore.json"))]|length')
          if [ "$SIG" -gt 0 ]; then echo "aktion=nichts" >> "$GITHUB_OUTPUT"; else echo "aktion=nachsignieren" >> "$GITHUB_OUTPUT"; fi
      - name: Herkunft bescheinigen
        id: herkunft
        if: steps.zustand.outputs.aktion != 'nichts'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.bau.outputs.ordner }}/*.plugin
            ${{ steps.bau.outputs.ordner }}/*.mcpb
            ${{ steps.bau.outputs.ordner }}/projekt_einstieg.md
      - name: Release anlegen oder ergaenzen
        if: steps.zustand.outputs.aktion != 'nichts'
        env:
          TAG: ${{ steps.bau.outputs.tag }}
          W: ${{ steps.bau.outputs.ordner }}
          TITEL: ${{ steps.bau.outputs.titel }}
          AKTION: ${{ steps.zustand.outputs.aktion }}
          BUENDEL: ${{ steps.herkunft.outputs.bundle-path }}
        run: |
          cp "$BUENDEL" "$W/$TAG.sigstore.json"
          DATEIEN=("$W"/*.plugin "$W"/*.mcpb "$W/projekt_einstieg.md" "$W/$TAG.sigstore.json")
          if [ "$AKTION" = neu ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest=false --title "$TITEL" --notes-file "$W/notiz.md" "${DATEIEN[@]}"
          else
            gh release upload "$TAG" --clobber "${DATEIEN[@]}"
            gh release edit "$TAG" --notes-file "$W/notiz.md"
          fi
          gh release view "$TAG" --json assets -q '.assets[].name'
