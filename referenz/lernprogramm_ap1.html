<!-- PWA (F2/G1.6): SW nur bei http(s) registrieren; file:// (Doppelklick) wird still übersprungen.
     G1.6 #11: wartende neue Fassung melden -> pwaUpdateBereit() (app_ui.js) zeigt den Hinweis und
     lädt erst im sicheren Moment neu (keine offene Frage, keine laufende Simulation). -->
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    var neugeladen = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (neugeladen) return;            // Reload-Schleife verhindern
      neugeladen = true;
      location.reload();
    });
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      function bereit(sw) {
        if (!sw) return;
        _pwaAktiviere = function () { sw.postMessage({ type: "SKIP_WAITING" }); };
        if (typeof pwaUpdateBereit === "function") pwaUpdateBereit();
      }
      // Fall 1: beim Laden wartet bereits eine neue Fassung
      if (reg.waiting && navigator.serviceWorker.controller) bereit(reg.waiting);
      // Fall 2: neue Fassung wird während der Sitzung gefunden
      reg.addEventListener("updatefound", function () {
        var neu = reg.installing;
        if (!neu) return;
        neu.addEventListener("statechange", function () {
          // controller vorhanden = es lief schon eine Fassung -> echtes Update (nicht Erstinstallation)
          if (neu.state === "installed" && navigator.serviceWorker.controller) bereit(neu);
        });
      });
    }).catch(function () {});
  });
}
</script>
